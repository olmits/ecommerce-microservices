server:
  port: 8081

spring:
  application:
    name: inventory-service

  rabbitmq:
    host: localhost
    port: 5672

  datasource:
    # Connect to the default 'postgres' database
    url: jdbc:postgresql://localhost:5432/postgres
    username: admin
    password: password

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/postgres
    user: admin
    password: password
    schemas: inventory_schema
    create-schemas: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate # Changed from update
    properties:
      hibernate:
        # Create a specific schema for this microservice
        default_schema: inventory_schema
        hbm2ddl.create_namespaces: true
    # Show SQL in the console so you can see it working
    show-sql: true